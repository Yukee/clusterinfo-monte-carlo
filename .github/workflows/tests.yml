name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and model invariant tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python run.py simulate --outer-runs 2 --patients 20 --out results/smoke
