[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clusterinfo-monte-carlo"
version = "0.1.0"
description = "Paired patient trajectories for exploring ClusterInfo's counterfactual impact"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
clusterinfo-mc = "clusterinfo_mc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
